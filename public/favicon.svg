<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="saber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="60%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="31" fill="#0a0a1a"/>
  <!-- Subtle aura -->
  <circle cx="32" cy="32" r="30" fill="url(#aura)"/>
  <!-- Lightsaber blade -->
  <rect x="30.5" y="4" width="3" height="36" rx="1.5" fill="url(#saber)"/>
  <!-- Blade glow -->
  <rect x="29" y="4" width="6" height="36" rx="3" fill="url(#glow)" opacity="0.5"/>
  <!-- Outer glow ring -->
  <ellipse cx="32" cy="20" rx="8" ry="18" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.2"/>
  <!-- Lightsaber hilt -->
  <rect x="28" y="40" width="8" height="4" rx="1" fill="#78909c"/>
  <rect x="27" y="44" width="10" height="2" rx="1" fill="#546e7a"/>
  <rect x="28" y="46" width="8" height="2" rx="0.5" fill="#37474f"/>
  <rect x="27" y="48" width="10" height="6" rx="1" fill="#263238"/>
  <!-- Hilt grip lines -->
  <line x1="28.5" y1="49" x2="35.5" y2="49" stroke="#455a64" stroke-width="0.5"/>
  <line x1="28.5" y1="50.5" x2="35.5" y2="50.5" stroke="#455a64" stroke-width="0.5"/>
  <line x1="28.5" y1="52" x2="35.5" y2="52" stroke="#455a64" stroke-width="0.5"/>
  <!-- Hilt emitter -->
  <rect x="29" y="38" width="6" height="2" rx="0.5" fill="#90a4ae"/>
  <!-- Subtle stars -->
  <circle cx="12" cy="14" r="0.7" fill="#fff" opacity="0.4"/>
  <circle cx="52" cy="10" r="0.5" fill="#fff" opacity="0.3"/>
  <circle cx="8" cy="38" r="0.6" fill="#fff" opacity="0.35"/>
  <circle cx="55" cy="30" r="0.5" fill="#fff" opacity="0.25"/>
  <circle cx="48" cy="50" r="0.4" fill="#fff" opacity="0.3"/>
  <circle cx="16" cy="55" r="0.5" fill="#fff" opacity="0.2"/>
</svg>
